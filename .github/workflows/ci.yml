name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Coverage
        run: npm run coverage
      - name: Summarize coverage
        if: always()
        run: |
          if [ -f coverage/report.txt ]; then
            grep 'ℹ' coverage/report.txt | sed 's/^ℹ //' | sed 's/^/    /' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Only the publisher may write, and only for pushes to main, so pull request
  # jobs never hold a write token.
  publish-badges:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Publish coverage badges to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish="$(mktemp -d)"
          git init -q "$publish"
          ls -1 coverage/badges
          cp coverage/badges/* "$publish"/
          git -C "$publish" add -A
          git -C "$publish" \
            -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "ci: coverage badges for ${GITHUB_SHA}"
          git -C "$publish" push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/badges"
